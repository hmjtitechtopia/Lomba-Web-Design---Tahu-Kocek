<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar ke Jagad WayangKita</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../asset/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Playfair Display -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wayangRed: '#8B2E1D',
            wayangDarkRed: '#6B1E12',
            wayangBg: '#FDFBF7',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="bg-[#FDFBF7] font-sans antialiased flex items-center justify-center min-h-screen">

  <div class="w-full bg-white min-h-screen shadow-xl overflow-hidden grid grid-cols-1 lg:grid-cols-12">

    <!-- Left Banner Section (Wayang Theme) -->
    <div
      class="lg:col-span-7 relative flex flex-col justify-between p-8 md:p-12 text-white bg-[#3B120B] overflow-hidden">
      <!-- Background Image with Overlay -->
      <div class="absolute inset-0 bg-cover bg-center z-0 opacity-40">
        <img class="w-full h-full object-cover"
          src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop"
          alt="Wayang Background">
      </div>
      <!-- Gradient Overlay matching screenshot tone -->
      <div class="absolute inset-0 bg-linear-to-tr from-[#380e07] via-[#611a10]/80 to-[#230904]/90 z-0"></div>

      <!-- Center Content in Left Banner -->
      <div class="relative z-10 my-auto py-10">
        <span class="text-xs uppercase tracking-[0.2em] font-semibold text-amber-200/90">
          SANGGAR MAYA PAKELIRAN
        </span>
        <h1 class="text-3xl md:text-5xl font-bold font-serif leading-tight mb-6 tracking-wide">
          Buka Pintu Sanggar
        </h1>

        <!-- Quote with vertical border -->
        <div class="border-l-2 border-amber-300/80 pl-4 py-1 mb-4">
          <p class="text-amber-100/90 italic font-serif text-sm md:text-base">
            “Memayu Hayuning Bawana lumantar Seni Pakeliran Adiluhung”
          </p>
        </div>
        <p class="text-xs text-amber-200/70 tracking-wide">
          Harmonisasi Jagad Kelir dan Ruang Digital Nusantara
        </p>
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="lg:col-span-5 p-8 md:p-12 flex flex-col justify-center bg-white">

      <div class="mb-6">
        <h2 class="text-2xl md:text-3xl font-bold text-[#3B120B] font-serif mb-2">
          Daftar Akun Sanggar Anda
        </h2>
      </div>

      <!-- Form Start (Statis tanpa JS) -->
      <form action="#" method="POST" class="space-y-6">

        <!-- Full Name / Dalang Stage Name -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 mb-1.5">
            Nama Lengkap / Nama Panggung Dalang
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
              <i class="far fa-user text-sm"></i>
            </div>
            <input type="text" required placeholder="Ki Danang Wicaksana"
              class="block w-full pl-10 pr-4 py-2.5 text-xs bg-white border border-neutral-200 rounded-lg focus:ring-2 focus:ring-[#8B2E1D] focus:border-[#8B2E1D] outline-none transition placeholder:text-neutral-400 text-neutral-800">
          </div>
        </div>

        <!-- Email or Sanggar ID -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 mb-1.5">
            Surel atau ID Sanggar
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
              <i class="far fa-envelope text-sm"></i>
            </div>
            <input type="email" required placeholder="dalangmuda@wayangkita.id"
              class="block w-full pl-10 pr-4 py-2.5 text-xs bg-white border border-neutral-200 rounded-lg focus:ring-2 focus:ring-[#8B2E1D] focus:border-[#8B2E1D] outline-none transition placeholder:text-neutral-400 text-neutral-800">
          </div>
        </div>

        <!-- Password Grid (Password & Confirm Password) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <!-- Password -->
          <div>
            <div class="flex items-center mb-1.5">
              <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-600">
                Kata Sandi
              </label>
            </div>
            <div class="relative rounded-lg shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                <i class="fas fa-lock text-sm"></i>
              </div>
              <input type="password" required placeholder="Masukkan kata sandi"
                class="block w-full pl-10 pr-9 py-2.5 text-xs bg-white border border-neutral-200 rounded-lg focus:ring-2 focus:ring-[#8B2E1D] focus:border-[#8B2E1D] outline-none transition placeholder:text-neutral-400 text-neutral-800">
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-400">
                <i class="far fa-eye text-xs"></i>
              </div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-600">
                Konfirmasi Kata Sandi
              </label>
            </div>
            <div class="relative rounded-lg shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-neutral-400">
                <i class="fas fa-redo text-xs"></i>
              </div>
              <input type="password" required placeholder="Ulangi kata sandi"
                class="block w-full pl-10 pr-9 py-2.5 text-xs bg-white border border-neutral-200 rounded-lg focus:ring-2 focus:ring-[#8B2E1D] focus:border-[#8B2E1D] outline-none transition placeholder:text-neutral-400 text-neutral-800">
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-400">
                <i class="far fa-eye text-xs"></i>
              </div>
            </div>
          </div>
        </div>



        <!-- Primary Register Button -->
        <a href="login.html"
          class="w-full flex items-center justify-center space-x-2 py-3 px-4 bg-[#8B2E1D] hover:bg-[#722416] text-white font-medium text-sm rounded-lg shadow-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#8B2E1D] mt-2">
          <span>Daftar ke Jagad WayangKita</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </a>
      </form>

      <!-- Redirect to Login Footer -->
      <div
        class="mt-6 text-center text-xs md:text-sm text-neutral-500 bg-neutral-50 py-3 rounded-lg border border-neutral-100">
        Sudah memiliki Sanggar Akun?
        <a href="login.html" class="font-semibold text-[#8B2E1D] hover:underline ml-1">
          Masuk ke Sanggar Anda &rarr;
        </a>
      </div>

    </div>

  </div>

</body>

</html>
